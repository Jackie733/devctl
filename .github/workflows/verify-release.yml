name: Verify public release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable version tag to verify
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify anonymous downloads and updates in an isolated HOME
        env:
          TAG: ${{ inputs.tag }}
        run: python3 tests/support/public_release.py "$TAG"
