name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (empty uses the selected ref)
        type: string
        default: ''
      publish:
        description: Publish the existing tag after all checks (requires a version tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: '1.98.1'
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
  PUBLISH_REQUESTED: ${{ inputs.publish || false }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      TMPDIR: /tmp
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install build and test tools
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools python3 zsh
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy --target "${{ matrix.target }}"
          rustup override set "$RUST_TOOLCHAIN"
      - name: Validate release version
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1']))
          version = next(p['version'] for p in metadata['packages'] if p['name'] == 'devctl' and p['id'] in metadata['workspace_members'])
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version), 'Stable version required'
          assert not os.environ['RELEASE_TAG'] or os.environ['RELEASE_TAG'] == 'v' + version, 'Tag/package version mismatch'
          assert os.environ['PUBLISH_REQUESTED'] != 'true' or os.environ['RELEASE_TAG'], 'Manual publishing requires an existing version tag'
          PY
      - name: Check and test
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          python3 tests/support/install_scripts.py
          python3 tests/support/merge_release.py
      - name: Build and verify the native artifact
        run: |
          cargo build --release --locked --target "${{ matrix.target }}"
          if [[ "$RUNNER_OS" == macOS ]]; then
            codesign --force --sign - ./target/${{ matrix.target }}/release/devctl
          fi
          version=$(./target/${{ matrix.target }}/release/devctl --version)
          python3 tests/support/release_artifact.py ./target/${{ matrix.target }}/release/devctl "${version#devctl }"
          python3 tests/support/package_release.py ./target/${{ matrix.target }}/release/devctl
          for scenario in lifecycle reconnect slow high discovery navigation copying windows-copying mac-copying history disk-history; do
            python3 tests/support/tui_pty.py ./target/${{ matrix.target }}/release/devctl "$scenario"
          done
      - name: Package the exact source commit
        run: bash scripts/package-release.sh ./target/${{ matrix.target }}/release/devctl dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.run_id }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: (github.event_name == 'push' || inputs.publish) && (inputs.tag != '' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-${{ github.run_id }}-*
          path: bundles
      - name: Merge verified platform bundles
        run: python3 scripts/merge-release.py bundles dist
      - name: Verify and publish the complete release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          sha256sum --check SHA256SUMS
          assets=("devctl-$TAG-x86_64-unknown-linux-musl" "devctl-$TAG-aarch64-apple-darwin" devctl-update "devctl-$TAG-source.tar.gz" update.json SHA256SUMS)
          if gh release view "$TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-state"; then
            [[ $(cat "$RUNNER_TEMP/release-state") == true ]] || { echo 'Refusing to replace an already published release.' >&2; exit 1; }
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --draft --title "$TAG" --notes-file release-notes.md
          fi
          gh release edit "$TAG" --draft=false --latest

  verify:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
