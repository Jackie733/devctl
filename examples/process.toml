# Commands for learning process creation, exit handling, and stopping on Unix.
# Any unrequested service exit, including exit code 0, is treated as a failure.
version = 1

[workspace]
name = "process-basics"

[projects.demo]
path = ".."

[services.hello]
project = "demo"
cmd = ["sh", "-c", 'printf "Child cwd: "; pwd; printf "Hello from child\n"']
autostart = false

[services.failure]
project = "demo"
cmd = ["sh", "-c", "exit 7"]
autostart = false

[services.arguments]
project = "demo"
cmd = ["printf", "%s\\n", "two words", "$HOME", "*.rs"]
autostart = false

[services.missing]
project = "demo"
cmd = ["devctl-command-that-does-not-exist"]
autostart = false

[services.cwd]
project = "demo"
cwd = "src"
cmd = ["pwd"]
autostart = false

[services.stdin_eof]
project = "demo"
cmd = ["sh", "-c", 'if read line; then exit 9; fi; printf "stdin EOF\n"']
autostart = false

[services.signal]
project = "demo"
cmd = ["sh", "-c", "kill -TERM $$"]
autostart = false

[services.long_running]
project = "demo"
cmd = ["sleep", "60"]
autostart = false

[services.process_tree]
project = "demo"
cmd = ["sh", "-c", 'sleep 60 & printf "Worker PID: %s\n" "$!"; wait']
autostart = false

[services.ignore_term]
project = "demo"
cmd = ["sh", "-c", 'trap "" TERM; printf "Ready\n"; exec sleep 60']
autostart = false

[services.graceful]
project = "demo"
cmd = ["sh", "-c", '''trap 'printf "TERM handled\n"; exit 0' TERM; printf "Ready\n"; while :; do sleep 1; done''']
autostart = false

[services.stubborn_worker]
project = "demo"
cmd = ["sh", "-c", '''sh -c 'trap "" TERM; printf "Worker PID: %s\n" "$$"; exec sleep 60' & wait''']
autostart = false
