version = 1

[workspace]
name = "local-dev"

[projects.backend]
path = "../"

[projects.frontend]
path = "../"

[services.api]
project = "backend"
cmd = ["cargo", "run"]

[services.web]
project = "frontend"
cmd = ["npm", "run", "dev"]
autostart = false
depends_on = [
  {service = "api", condition = "started"}
]
