[package]
name = "devctl"
version = "1.5.0"
edition = "2024"
description = "A terminal workspace manager for local development services"
license = "MIT"
repository = "https://github.com/Jackie733/devctl"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
nix = { version = "0.31.3", features = ["signal", "user", "fs"] }
ratatui = { version = "0.30", default-features = false, features = ["std", "crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1", features = ["macros", "rt", "process", "signal", "time", "sync", "net", "io-util"] }
toml = "1"
