[package]
name = "devctl"
version = "0.2.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
nix = { version = "0.31.3", features = ["signal", "user", "fs"] }
ratatui = { version = "0.30", default-features = false, features = ["std", "crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "process", "signal", "time", "sync", "net", "io-util"] }
toml = "1"
