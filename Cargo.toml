[package]
name = "devctl"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31.3", features = ["signal", "user", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "process", "signal", "time", "sync", "net", "io-util"] }
toml = "1"
